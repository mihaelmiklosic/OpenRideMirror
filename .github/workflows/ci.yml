name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-and-esp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pyproject.toml

      - name: Install ORM tools
        run: python -m pip install -e tools

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install pinned ESP32 toolchain and U8g2
        run: |
          arduino-cli config init --overwrite
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.11 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install U8g2@2.36.18

      - name: Run release source gates and both ESP builds
        run: orm release check
